
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Characters</title>
    <link rel="stylesheet" href="../characters/character.css">
</head>






<body>

<div class="overlay">

    <div class="container">

        <div class="left">

            <h1>The Last Samurai</h1>
            <p>Choose Your Warrior</p>

            <div class="character-card active" data-character="kaizen">
                <img src="../assest/kaizen.jpg">
                <div>
                    <h3>Kaizen</h3>
                    <span>Shadow Assassin</span>
                </div>
            </div>

            <div class="character-card" data-character="rayko">
                <img src="../assest/rayko.jpg">
                <div>
                    <h3>Rayko</h3>
                    <span>Night ghost of Ronin</span>
                </div>
            </div>

            <div class="character-card" data-character="azula">
                <img src="../assest/azula.jpg">
                <div>
                    <h3>Azula</h3>
                    <span>The Sword-Wielding Goddess</span>
                </div>
            </div>

            <div class="character-card" data-character="akuma">
                <img src="../assest/akuma.jpg">
                <div>
                    <h3>Akuma</h3>
                    <span>Blood Master</span>
                </div>
            </div>

            <div class="character-card" data-character="ryoshi">
                <img src="../assest/ryoshi.jpg">
                <div>
                    <h3>Ryoshi</h3>
                    <span>The Energetic God</span>
                </div>
            </div>

        </div>

        <div class="right">

            <div class="info-card">

    <div class="info-content">

        <div class="image-side">

            <img id="hero" class="hero" src="../assest/kaizen.jpg">

        </div>

        <div class="details">

            <h2 id="name">Kaizen</h2>

            <p id="class" class="class">Shadow Assassin</p>

            <div class="stat">
                <span>Power</span>
                <div class="bar">
                    <div id="power" class="fill" style="width:95%"></div>
                </div>
            </div>

            <div class="stat">
                <span>Attack</span>
                <div class="bar">
                    <div id="attack" class="fill" style="width:90%"></div>
                </div>
            </div>

            <div class="stat">
                <span>Defense</span>
                <div class="bar">
                    <div id="defense" class="fill" style="width:85%"></div>
                </div>
            </div>

            <div class="stat">
                <span>Speed</span>
                <div class="bar">
                    <div id="speed" class="fill" style="width:98%"></div>
                </div>
            </div>

            <h3>Ability</h3>

            <p id="ability">Shadow Step</p>

            <h3>Description</h3>

            <p id="description">
                Master of silent assassination.
            </p>

            <button>Select Character</button>

        </div>

    </div>

</div>
    </div>

</div>
<script src="../characters/character.js"></script>
</body>


</html>
